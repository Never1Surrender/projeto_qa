name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Criar .env para o Docker Compose
      run: |
        cat <<EOF > .env
        DB_ROOT_PASSWORD=root
        DB_NAME=adocao_animais
        DB_USER=adocao_user
        DB_PASSWORD=adocao_pass
        EOF

    - name: Subir aplicação (banco + backend + frontend)
      run: docker compose up -d --build

    - name: Aguardar frontend responder
      run: |
        timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 2; done'

    - name: Instalar dependências
      run: bun install

    - name: Instalar navegadores do Playwright
      run: bunx playwright install --with-deps

    - name: Rodar testes do Playwright
      run: bunx playwright test

    - name: Logs dos containers (em caso de falha)
      if: failure()
      run: docker compose logs

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Derrubar aplicação
      if: always()
      run: docker compose down -v
